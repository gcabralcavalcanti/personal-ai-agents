# Builds every demo page without an API key (recorded answers) and publishes them on GitHub Pages.
# Turn it on once: Settings > Pages > Source = GitHub Actions. Then every push to main updates the live demo.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Demo pages (no key, nothing written anywhere but output/)
        env:
          ANTHROPIC_API_KEY: ""
        run: python demo.py --yes --no-open
      - name: Collect the pages
        run: mkdir site && cp output/*.html site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
